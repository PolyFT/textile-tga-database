name: TG-LOI database validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**/*.csv"
      - "schema/**"
      - "scripts/validate_tg_loi.py"
      - "requirements.txt"
  pull_request:
    paths:
      - "data/**/*.csv"
      - "schema/**"
      - "scripts/validate_tg_loi.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate scientific ranges and strict pairability
        run: python scripts/validate_tg_loi.py
