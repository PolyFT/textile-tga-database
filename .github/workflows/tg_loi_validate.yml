name: TG-LOI database validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**/*.csv"
      - "schema/**"
      - "scripts/**"
      - "data/curation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tg_loi_validate.yml"
  pull_request:
    paths:
      - "data/**/*.csv"
      - "schema/**"
      - "scripts/**"
      - "data/curation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tg_loi_validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Validate scientific ranges and evidence-gated pairability
        run: python scripts/validate_tg_loi.py
      - name: Export source-admitted textile pairs
        run: python scripts/textile_scope.py
      - name: Check committed snapshot consistency
        run: git diff --exit-code -- README.md data/tg_loi_master.csv data/tg_loi_candidates.csv data/automation/validation_report.json data/automation/pairing_quarantine.csv data/automation/source_import_quarantine.csv data/tg_loi_textile_master.csv data/automation/textile_scope_report.json
