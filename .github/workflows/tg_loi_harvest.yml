name: TG-LOI evidence harvest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg_loi_harvest.yml"
      - "scripts/harvest_tg_loi.py"
      - "scripts/validate_tg_loi.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Maximum new reviewable candidates per run"
        required: false
        default: "100"
      queries_per_run:
        description: "Stateful OpenAlex query pages processed per run"
        required: false
        default: "2"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tg-loi-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover and extract reviewable TG-LOI evidence
        env:
          MAX_NEW: ${{ github.event.inputs.max_new || '100' }}
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || '2' }}
        run: python scripts/harvest_tg_loi.py --max-new "$MAX_NEW" --per-query 20 --queries-per-run "$QUERIES_PER_RUN" --max-pages-per-query 100

      - name: Rebuild strict paired master
        run: python scripts/validate_tg_loi.py

      - name: Commit evidence queue and paired master
        run: |
          git config user.name "tg-loi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/automation data/tg_loi_master.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "bot: harvest TG-LOI evidence and rebuild paired master"
          git push
