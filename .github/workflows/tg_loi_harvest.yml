name: TG-LOI closed-loop harvest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg_loi_harvest.yml"
      - "scripts/harvest_tg_loi.py"
      - "scripts/extract_tg_loi.py"
      - "scripts/validate_tg_loi.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Maximum new reviewable candidates per run"
        required: false
        default: "200"
      queries_per_run:
        description: "Stateful OpenAlex query pages processed per run"
        required: false
        default: "8"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tg-loi-master-write
  cancel-in-progress: false

jobs:
  harvest_extract_promote:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fast-forward to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover reviewable TG-LOI evidence
        env:
          MAX_NEW: ${{ github.event.inputs.max_new || '200' }}
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || '8' }}
        run: python scripts/harvest_tg_loi.py --max-new "$MAX_NEW" --per-query 40 --queries-per-run "$QUERIES_PER_RUN" --max-pages-per-query 100

      - name: Extract sample-level pairs and promote Grade A
        run: python scripts/extract_tg_loi.py

      - name: Rebuild strict paired master
        run: python scripts/validate_tg_loi.py

      - name: Commit closed-loop outputs
        run: |
          git config user.name "tg-loi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/automation data/incoming data/tg_loi_master.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Remote main advanced during this run; skip this stale commit. The next queued/hourly run will recompute from latest main."
            exit 0
          fi
          git commit -m "bot: closed-loop TG-LOI harvest, extraction and promotion"
          git push origin main
