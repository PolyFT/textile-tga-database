name: TG-LOI literature discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg_loi_harvest.yml"
      - "scripts/harvest_tg_loi.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Maximum new reviewable candidates per run"
        required: false
        default: "200"
      queries_per_run:
        description: "Stateful OpenAlex query pages processed per run"
        required: false
        default: "6"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tg-loi-all-writes-v3
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fast-forward to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover reviewable TG-LOI evidence
        env:
          MAX_NEW: ${{ github.event.inputs.max_new || '200' }}
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || '6' }}
        run: python scripts/harvest_tg_loi.py --max-new "$MAX_NEW" --per-query 30 --queries-per-run "$QUERIES_PER_RUN" --max-pages-per-query 100
      - name: Commit discovery outputs
        run: |
          git config user.name "tg-loi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/automation/candidate_extractions.csv data/automation/harvest_state.json
          if git diff --cached --quiet; then
            echo "No discovery changes"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Remote main advanced; skip stale discovery commit. Next run will recompute."
            exit 0
          fi
          git commit -m "bot: discover TG-LOI literature candidates"
          git push origin main
