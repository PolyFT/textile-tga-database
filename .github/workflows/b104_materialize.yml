name: B104 branch-only snapshot materialization
on:
  push:
    branches: [data/source-verification-20261001-b104]
    paths: [.github/workflows/b104_materialize.yml]
permissions:
  contents: write
concurrency:
  group: tg-loi-b104-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/source-verification-20261001-b104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: python scripts/validate_tg_loi.py
      - name: Materialize snapshots and remove this temporary workflow
        run: |
          git config user.name 'tg-loi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md data/tg_loi_master.csv data/tg_loi_candidates.csv data/automation/validation_report.json data/automation/pairing_quarantine.csv data/automation/source_import_quarantine.csv
          git rm .github/workflows/b104_materialize.yml
          git commit -m 'build: materialize b104 reviewed snapshot and remove temporary workflow'
          git push origin HEAD:data/source-verification-20261001-b104
