name: Materialize reviewed TG-LOI batch b41

on:
  push:
    branches: [data/source-verification-20260930-b41]
    paths: [.github/workflows/tg_loi_b41_materialize.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-loi-b41-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all offline tests and compile checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
      - name: Rebuild reviewed outputs and verify expected scope
        run: |
          python scripts/validate_tg_loi.py
          python -c "import json; r=json.load(open('data/automation/validation_report.json')); assert r['verified_exact_sample_states']==221, r; assert r['verified_exact_condition_records']==254, r; assert not r['errors'], r"
      - name: Commit generated outputs and remove one-time helper
        run: |
          BRANCH="$GITHUB_REF_NAME"
          test "$BRANCH" = "data/source-verification-20260930-b41"
          git config user.name "tg-loi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md data/tg_loi_master.csv data/tg_loi_candidates.csv data/automation/validation_report.json data/automation/pairing_quarantine.csv data/automation/source_import_quarantine.csv
          git rm .github/workflows/tg_loi_b41_materialize.yml
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$BRANCH)" ]; then
            echo "Branch advanced; refuse stale output commit."
            exit 1
          fi
          git commit -m "data: materialize b41 reviewed outputs and remove temporary helper"
          git push origin HEAD:"$BRANCH"
